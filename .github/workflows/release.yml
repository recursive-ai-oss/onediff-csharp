name: release

# Publishes the NuGet packages when a version tag is pushed. nuget.org trusts this
# workflow through Trusted Publishing: the job exchanges its GitHub identity token for
# a short-lived API key, so no key is stored in the repository or its secrets.
#
# Three jobs, each with only the permissions it needs:
#   verify   the tag is well formed, on main, CI passed on that commit, the changelog has the version
#   publish  build, test, pack, attest, push to nuget.org
#   release  create the GitHub release with the changelog section as notes and the packages attached
on:
  push:
    tags: ['v*']

permissions: {}

defaults:
  run:
    shell: bash

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  # Deterministic paths in the published binaries and symbols come from Directory.Build.props (CI=true on GitHub), for src/ only.

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # Actions are pinned by commit because the publish job can obtain a publishing key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is well formed
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::$TAG is not a version tag such as v1.2.3 or v1.2.3-preview.1"; exit 1; }
      - name: Tag is on main
        run: |
          # Only commits that are already on main are published.
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::the tagged commit is not on main"; exit 1; }
      - name: CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [ "$passed" -lt 1 ]; then
            echo "::error::no successful ci run for $GITHUB_SHA; wait for CI on this commit and push the tag again"
            exit 1
          fi
      - name: Changelog has a section for the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          awk -v heading="## [$version]" 'index($0, heading) == 1 { found = 1 } END { exit !found }' CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no \"## [$version]\" section"; exit 1; }

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write       # nuget.org Trusted Publishing and the provenance attestation
      attestations: write   # provenance for the packages
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep build output out of the checkout
        run: echo "ONEDIFF_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Sister-library previews that are not on nuget.org yet come from the feed in ONEDIFF_PREVIEW_FEED (docs/building.md).
      - name: Preview feed
        env:
          ONEDIFF_PREVIEW_FEED: ${{ vars.ONEDIFF_PREVIEW_FEED }}
        run: |
          if [ -n "$ONEDIFF_PREVIEW_FEED" ]; then cp docs/nuget-local.config.example NuGet.Config; fi

      - name: Restore
        run: dotnet restore OneDiff.slnx

      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Every project that ships must build the version the tag names. Which projects ship is decided by
          # IsPackable in the projects themselves (Directory.Build.props), so a new package joins without a change here.
          shipped=0
          for project in src/*/*.csproj; do
            packable=$(dotnet msbuild "$project" -getProperty:IsPackable | tr -d '[:space:]')
            [ "$packable" = "true" ] || continue
            shipped=$((shipped + 1))
            version=$(dotnet msbuild "$project" -getProperty:PackageVersion | tr -d '[:space:]')
            if [ "v$version" != "$TAG" ]; then
              echo "::error::tag $TAG does not match the package version $version of $project"
              exit 1
            fi
          done
          if [ "$shipped" -eq 0 ]; then echo "::error::no packable project found"; exit 1; fi
          echo "$shipped packages at $TAG"

      # A tag that does not build and pass its tests never publishes.
      - name: Build
        run: dotnet build OneDiff.slnx -c Release --no-restore
      - name: Test
        run: dotnet test --solution OneDiff.slnx -c Release --no-build --results-directory "$ONEDIFF_ARTIFACTS/TestResults"

      - name: Pack
        # Every packable project (the packages and the tool), from the binaries the tests ran on. Symbols come out as .snupkg files.
        run: |
          dotnet pack OneDiff.slnx -c Release --no-build -o "$RUNNER_TEMP/packages"
          ls -l "$RUNNER_TEMP/packages"
          # One package per shipped project, and nothing else.
          expected=0
          for project in src/*/*.csproj; do
            if [ "$(dotnet msbuild "$project" -getProperty:IsPackable | tr -d '[:space:]')" = "true" ]; then expected=$((expected + 1)); fi
          done
          packed=$(find "$RUNNER_TEMP/packages" -name '*.nupkg' | wc -l)
          if [ "$packed" -ne "$expected" ]; then echo "::error::packed $packed packages, expected $expected"; exit 1; fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/packages/*.nupkg
            ${{ runner.temp }}/packages/*.snupkg

      - name: Keep the packages for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            ${{ runner.temp }}/packages/*.nupkg
            ${{ runner.temp }}/packages/*.snupkg
          if-no-files-found: error

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: recursiveai.org

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # --no-symbols: pushing a .nupkg would otherwise also push the .snupkg beside it, and the next line pushes it again.
          dotnet nuget push "$RUNNER_TEMP/packages/*.nupkg" --api-key "$NUGET_API_KEY" --no-symbols \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "$RUNNER_TEMP/packages/*.snupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          # The notes are the changelog section of this version: from its heading up to the
          # next version heading or the link definitions at the end of the file.
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { on = 1; next }
            on && (index($0, "## [") == 1 || $0 ~ /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::the changelog section for $version is empty"; exit 1; fi
          flags=()
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "${flags[@]}" packages/*
