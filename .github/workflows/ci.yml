name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  plan:
    # Decides what the other jobs build: everything, or the projects that restore without the sister-library previews.
    runs-on: ubuntu-latest
    outputs:
      solution: ${{ steps.select.outputs.solution }}
      filter: ${{ steps.select.outputs.filter }}
      smoke: ${{ steps.select.outputs.smoke }}
      wasm: ${{ steps.select.outputs.wasm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the solution
        id: select
        env:
          ONEDIFF_PREVIEW_FEED: ${{ vars.ONEDIFF_PREVIEW_FEED }}
        run: python3 tools/ci/select-solution.py >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build output goes outside the checkout, as it does locally; the runner context is only available inside steps.
      - name: Artifacts directory
        shell: bash
        run: echo "ONEDIFF_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # Sister-library previews that are not on nuget.org yet: see docs/building.md.
      - name: Preview feed and project filter
        shell: bash
        env:
          ONEDIFF_PREVIEW_FEED: ${{ vars.ONEDIFF_PREVIEW_FEED }}
          FILTER: ${{ needs.plan.outputs.filter }}
        run: |
          if [ -n "$ONEDIFF_PREVIEW_FEED" ]; then cp docs/nuget-local.config.example NuGet.Config; fi
          if [ -n "$FILTER" ]; then printf '%s\n' "$FILTER" > OneDiff.Hosted.slnf; fi
      - name: Build
        run: dotnet build ${{ needs.plan.outputs.solution }} -c Release
      - name: Test
        run: dotnet test --solution ${{ needs.plan.outputs.solution }} -c Release --no-build
      - name: Native AOT toolchain (Linux)
        if: runner.os == 'Linux' && needs.plan.outputs.smoke == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Publish AOT smoke app (warnings are errors)
        if: needs.plan.outputs.smoke == 'true'
        run: dotnet publish samples/OneDiff.AotSmoke -c Release -r ${{ matrix.rid }} -o ${{ runner.temp }}/smoke -warnaserror
      - name: Run AOT smoke app
        if: needs.plan.outputs.smoke == 'true'
        shell: bash
        run: '"$RUNNER_TEMP/smoke/OneDiff.AotSmoke"'
      - name: Publish the onediff tool with NativeAOT (warnings are errors)
        if: needs.plan.outputs.smoke == 'true'
        run: dotnet publish src/OneDiff.Cli -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o ${{ runner.temp }}/tool -warnaserror
      - name: Run the AOT tool
        if: needs.plan.outputs.smoke == 'true'
        shell: bash
        run: |
          printf 'a\nb\n' > "$RUNNER_TEMP/a.txt"; printf 'a\nc\n' > "$RUNNER_TEMP/b.txt"
          status=0; "$RUNNER_TEMP"/tool/OneDiff.Cli diff "$RUNNER_TEMP/a.txt" "$RUNNER_TEMP/b.txt" > "$RUNNER_TEMP/diff.out" || status=$?
          # GNU diff's convention: 1 means the files differ.
          [ "$status" = 1 ] && grep -q '^+c$' "$RUNNER_TEMP/diff.out"

  pack:
    needs: plan
    # Builds every packable project (the packages and the tool) as artifacts only; nothing is pushed anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Artifacts directory
        shell: bash
        run: echo "ONEDIFF_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # Sister-library previews that are not on nuget.org yet: see docs/building.md.
      - name: Preview feed and project filter
        shell: bash
        env:
          ONEDIFF_PREVIEW_FEED: ${{ vars.ONEDIFF_PREVIEW_FEED }}
          FILTER: ${{ needs.plan.outputs.filter }}
        run: |
          if [ -n "$ONEDIFF_PREVIEW_FEED" ]; then cp docs/nuget-local.config.example NuGet.Config; fi
          if [ -n "$FILTER" ]; then printf '%s\n' "$FILTER" > OneDiff.Hosted.slnf; fi
      - name: Pack
        run: dotnet pack ${{ needs.plan.outputs.solution }} -c Release -o ${{ runner.temp }}/packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages/*

  wasm:
    # The test sources of the core, .Documents, .Pdf and .Ocr, each compiled into a browser WebAssembly app and run in headless
    # Chrome (xunit.v3 has no browser runner, so tests/OneDiff.Tests.Wasm compiles the same test sources and runs them with a small
    # runner; tests that need files, threads or processes carry [Trait("Host", "Native")] and are counted as skipped).
    # Fails on any test failure. Without a preview feed only the suites that restore from nuget.org run.
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Artifacts directory
        shell: bash
        run: echo "ONEDIFF_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools
      - name: Install the browser driver (the runner's Google Chrome is used as the browser)
        run: python3 -m pip install playwright==1.57.0
      - name: Publish and run the browser tests
        env:
          ONEDIFF_PREVIEW_FEED: ${{ vars.ONEDIFF_PREVIEW_FEED }}
          SUITES: ${{ needs.plan.outputs.wasm }}
        run: |
          read -ra suites <<< "$SUITES"
          tests/OneDiff.Tests.Wasm/run.sh "$RUNNER_TEMP/wasm" "${suites[@]}"
